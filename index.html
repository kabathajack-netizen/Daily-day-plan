<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DayPlan">
<title>DayPlan</title>
<style>
:root{--bg:#edf1f5;--card:#fff;--ink:#12263a;--mut:#6b7a8f;--line:#d8e0e8;--acc:#0b7a75;--acct:#fff;--hi:#f2c14e;--ex:#d1495b;--st:#2e6fd8;--ch:#d58a1f;--ot:#6b7a8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a26;--card:#17283a;--ink:#e8eef4;--mut:#93a4b8;--line:#27394d;--acc:#35b8b0;--acct:#06201e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;line-height:1.15;margin:4px 0 2px;letter-spacing:-.5px}
.dt{color:var(--mut);font-size:15px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px}
.prog{height:10px;background:var(--line);border-radius:5px;margin:16px 0 6px;overflow:hidden}
#bar{height:100%;width:0;background:var(--acc);border-radius:5px;-webkit-transition:width .3s;transition:width .3s}
#pt{font-size:14px;color:var(--mut)}
#week{display:flex;margin:14px -4px 8px}
.d{-webkit-box-flex:1;-webkit-flex:1;flex:1;margin:0 4px;text-align:center;padding:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:12px}
.d b{display:block;font-size:17px}
.d.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.d.td{border-color:var(--acc)}
.plan{background:var(--hi);color:#2a2200;border-radius:16px;padding:14px;margin:12px 0}
.plan p{margin:0 0 10px;font-weight:600}
.chip{display:inline-block;border:1px solid rgba(0,0,0,.35);border-radius:16px;padding:6px 12px;margin:0 6px 6px 0;font-size:14px;background:rgba(255,255,255,.5);color:#2a2200}
ul{list-style:none;margin:0;padding:0}
li.t{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ot);border-radius:14px;padding:12px;margin:10px 0}
li.t.exercise{border-left-color:var(--ex)}li.t.study{border-left-color:var(--st)}li.t.chores{border-left-color:var(--ch)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);background:none;margin-right:12px;-webkit-flex-shrink:0;flex-shrink:0;color:var(--acct);font-size:16px;padding:0}
.done .ck{background:var(--acc);border-color:var(--acc)}
.tx{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-width:0}
.tt{font-weight:600;word-wrap:break-word}
.done .tt{text-decoration:line-through;color:var(--mut)}
.mt{font-size:13px;color:var(--mut)}
.late .mt{color:var(--ex);font-weight:600}
.x{border:0;background:none;color:var(--mut);font-size:22px;padding:6px 10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));-webkit-transform:translateX(-50%);transform:translateX(-50%);background:var(--acc);color:var(--acct);border:0;border-radius:30px;padding:15px 30px;font-size:17px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ov{display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.5);z-index:20;-webkit-overflow-scrolling:touch;overflow-y:auto}
.ov.show{display:block}
.sh{background:var(--card);max-width:560px;margin:60px auto 0;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));min-height:100%}
.sh h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none;min-height:46px}
.row{display:flex}.row>div{-webkit-box-flex:1;-webkit-flex:1;flex:1}.row>div+div{margin-left:10px}
.cats{display:flex;margin-top:4px}
.cats button{-webkit-box-flex:1;-webkit-flex:1;flex:1;margin-right:6px;padding:10px 2px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.cats button:last-child{margin-right:0}
.cats button.on{border-color:var(--acc);background:var(--acc);color:var(--acct);font-weight:700}
.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:var(--acc);color:var(--acct);font-size:17px;font-weight:700}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:10px}
.note{font-size:13px;color:var(--mut);margin-top:14px}
#al{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:40}
.a{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.a b{display:block;margin-bottom:8px}
.a button{border:0;border-radius:8px;padding:9px 12px;margin-right:8px;font-size:14px;font-weight:600;background:var(--hi);color:#2a2200}
.tabs{display:flex;margin:0 0 10px}
.tabs button{-webkit-box-flex:1;-webkit-flex:1;flex:1;padding:11px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin-right:6px;border-radius:10px}
.tabs button:last-child{margin-right:0}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--acct);font-weight:700}
.pb{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.pb.now{border-color:var(--acc);border-width:2px}
.pb h3{margin:0 0 4px;font-size:16px}
.pb ul{list-style:disc;padding-left:20px;font-size:15px}
.pb p{margin:4px 0;font-size:15px}
.dl{font-size:13px;margin-top:4px;line-height:1.35}
.sm{font-size:14px;color:var(--mut)}
textarea{min-height:90px;font-size:14px;word-break:break-all;font-family:monospace}
.bt{display:flex;margin:12px 0 0}
.bt .ib{-webkit-box-flex:1;-webkit-flex:1;flex:1;margin-right:6px;padding:10px 4px}
.bt .ib:last-child{margin-right:0}
.gr{display:flex;align-items:flex-end;height:120px;margin:10px 0 4px}
.gc{-webkit-box-flex:1;-webkit-flex:1;flex:1;margin:0 2px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:11px;color:var(--mut)}
.gb{background:var(--acc);border-radius:4px 4px 0 0;min-height:3px;margin-bottom:3px}
.big{font-size:30px;font-weight:800;line-height:1.1}
.sg{display:flex;flex-wrap:wrap;margin:0 -5px}
.sg>div{width:50%;padding:5px}
.sg .pb{margin:0}
</style>
</head>
<body>
<div id="al"></div>
<div id="app">
  <div class="top"><div><h1 id="hi">Hello</h1><div class="dt" id="dt"></div></div></div>
  <div class="bt"><button class="ib" id="plb">Plans</button><button class="ib" id="prb">Progress</button><button class="ib" id="gear">Settings</button></div>
  <div class="prog"><div id="bar"></div></div><div id="pt"></div>
  <div id="week"></div>
  <div id="plan" class="plan" style="display:none"><p>Good morning. Plan your day: tap an idea or add your own.</p><div id="chips"></div></div>
  <ul id="list"></ul>
</div>
<button id="fab">+ Add task</button>

<div class="ov" id="sheet"><div class="sh">
  <h2>New task</h2>
  <label>What will you do?</label><input id="f-title" type="text" placeholder="e.g. 30 min run" maxlength="80">
  <label>Type</label>
  <div class="cats" id="f-cats"><button data-c="exercise">Exercise</button><button data-c="study">Study</button><button data-c="chores">Chores</button><button data-c="other">Other</button></div>
  <div class="row"><div><label>Time</label><input id="f-time" type="time" value="08:00"></div>
  <div><label>Remind me</label><select id="f-lead"><option value="0">At the time</option><option value="5">5 min before</option><option value="10">10 min before</option><option value="15">15 min before</option><option value="30">30 min before</option></select></div></div>
  <label>Repeat</label>
  <select id="f-rep"><option value="none">Just this day</option><option value="daily">Every day</option><option value="weekdays">Weekdays (Mon–Fri)</option></select>
  <button class="btn" id="f-save">Save task</button>
  <button class="btn g" id="f-cancel">Cancel</button>
</div></div>

<div class="ov" id="plans"><div class="sh">
  <h2>My plans</h2>
  <div class="tabs"><button data-tab="ex" id="tb-ex">Exercise</button><button data-tab="di" id="tb-di">Diet</button></div>
  <div id="pl-body"></div>
  <button class="btn" id="pl-add"></button>
  <button class="btn g" id="pl-close">Close</button>
</div></div>

<div class="ov" id="prog"><div class="sh">
  <h2>My progress</h2>
  <div id="pg-body"></div>
  <button class="btn" id="pg-close">Close</button>
</div></div>

<div class="ov" id="set"><div class="sh">
  <h2>Settings</h2>
  <label>Morning “plan your day” reminder</label><input id="s-morn" type="time">
  <button class="btn g" id="s-notif">Allow phone notifications</button>
  <button class="btn g" id="s-test">Test a reminder</button>
  <p class="note" id="s-note"></p>
  <label>Backup code (save it in Notes)</label>
  <textarea id="s-code" placeholder="Tap Create backup code to see your code here. To restore, paste a code here, then tap Restore."></textarea>
  <button class="btn g" id="s-bk">Create backup code</button>
  <button class="btn g" id="s-rs">Restore from code</button>
  <button class="btn" id="s-close">Done</button>
</div></div>

<script>
(function(){
var KEY='dayplan1',S,sel=new Date(),cat='exercise',snz=[],audio=null;
function load(){try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null;}
 if(!S||!S.tasks){S={tasks:[],morning:'07:00',fired:{}};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(i){return document.getElementById(i);}
function p2(n){return n<10?'0'+n:''+n;}
function key(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function mins(t){var a=t.split(':');return (+a[0])*60+(+a[1]);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(t){var a=t.split(':'),h=+a[0],ap=h>=12?'PM':'AM';h=h%12;if(!h)h=12;return h+':'+a[1]+' '+ap;}
function occurs(t,d){var ds=key(d);if(t.repeat==='none')return t.date===ds;if(ds<t.date)return false;
 if(t.repeat==='dow')return t.dow.indexOf(d.getDay())>=0;
 if(t.repeat==='weekdays'){var w=d.getDay();return w>0&&w<6;}return true;}
function forDay(d){var r=[],i;for(i=0;i<S.tasks.length;i++){if(occurs(S.tasks[i],d))r.push(S.tasks[i]);}
 r.sort(function(a,b){var x=a.time||'99:99',y=b.time||'99:99';return x<y?-1:x>y?1:0;});return r;}
function isDone(t,d){return !!(t.done&&t.done[key(d)]);}
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var IDEAS=['Morning workout','Study session','Read 20 pages','Tidy my room','Laundry','Stretch 10 min'];

function render(){
 var now=new Date(),h=now.getHours(),today=key(now),selKey=key(sel),isToday=today===selKey;
 $('hi').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 $('dt').textContent=DN[sel.getDay()]+', '+sel.getDate()+' '+MN[sel.getMonth()]+(isToday?' (today)':'');
 var wk='',i,d,st=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay());
 for(i=0;i<7;i++){d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i);
  wk+='<button class="d'+(key(d)===selKey?' on':'')+(key(d)===today?' td':'')+'" data-d="'+key(d)+'">'+DN[d.getDay()]+'<b>'+d.getDate()+'</b></button>';}
 $('week').innerHTML=wk;
 var ts=forDay(sel),dn=0,out='';
 for(i=0;i<ts.length;i++){var t=ts[i],done=isDone(t,sel);if(done)dn++;
  var late=isToday&&!done&&t.time&&mins(t.time)<now.getHours()*60+now.getMinutes();
  out+='<li class="t '+t.cat+(done?' done':'')+(late?' late':'')+'"><button class="ck" data-k="'+t.id+'" aria-label="Mark done">'+(done?'✓':'')+'</button><div class="tx"><div class="tt">'+esc(t.title)+'</div><div class="mt">'+(t.time?fmt(t.time):'No time')+(t.repeat==='daily'?' · every day':t.repeat==='weekdays'?' · weekdays':'')+(late?' · overdue':'')+'</div>'+(t.wd!=null?'<div class="dl">'+esc(exLine(t.wd))+'</div>':'')+'</div><button class="x" data-x="'+t.id+'" aria-label="Delete">×</button></li>';}
 $('list').innerHTML=out||'<div class="empty">Nothing planned for this day.<br>Tap “Add task” to start.</div>';
 $('bar').style.width=(ts.length?Math.round(dn/ts.length*100):0)+'%';
 $('pt').textContent=ts.length?dn+' of '+ts.length+' done':'No tasks yet';
 var showPlan=isToday&&ts.length===0&&(h*60+now.getMinutes())>=mins(S.morning)-60&&h<12;
 $('plan').style.display=showPlan?'block':'none';
 if(showPlan&&!$('chips').innerHTML){var c='';for(i=0;i<IDEAS.length;i++)c+='<button class="chip" data-i="'+i+'">'+IDEAS[i]+'</button>';$('chips').innerHTML=c;}
}

function openSheet(id,show){$(id).className='ov'+(show?' show':'');}
function setCat(c){cat=c;var b=$('f-cats').getElementsByTagName('button'),i;for(i=0;i<b.length;i++)b[i].className=b[i].getAttribute('data-c')===c?'on':'';}
function openAdd(title){$('f-title').value=title||'';setCat(/workout|stretch/i.test(title||'')?'exercise':/study|read/i.test(title||'')?'study':/tidy|laundry/i.test(title||'')?'chores':cat);openSheet('sheet',true);}
function addTask(){var ti=$('f-title').value.replace(/^\s+|\s+$/g,'');if(!ti){$('f-title').focus();return;}
 S.tasks.push({id:'t'+Date.now()+Math.floor(Math.random()*1000),title:ti,cat:cat,time:$('f-time').value||'',lead:+$('f-lead').value,repeat:$('f-rep').value,date:key(sel),done:{}});
 save();openSheet('sheet',false);render();}

function unlock(){try{if(!audio){var C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C();}if(audio&&audio.state==='suspended')audio.resume();}catch(e){}}
function beep(){try{if(!audio)return;var n=0;(function go(){if(n++>=3)return;var o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.18);setTimeout(go,320);})();}catch(e){}
 try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
function alertUser(msg,tid,morning){
 var box=document.createElement('div');box.className='a';
 box.innerHTML='<b>'+esc(msg)+'</b>'+(morning?'<button data-a="plan">Plan now</button>':'<button data-a="done">Done</button><button data-a="snz">Snooze 10 min</button>')+'<button data-a="x">Dismiss</button>';
 box.onclick=function(e){var a=e.target.getAttribute&&e.target.getAttribute('data-a');if(!a)return;
  if(a==='done'){markDone(tid,new Date());}
  if(a==='snz'){snz.push({at:Date.now()+600000,msg:msg,id:tid});}
  if(a==='plan'){sel=new Date();render();openAdd('');}
  if(box.parentNode)box.parentNode.removeChild(box);};
 $('al').appendChild(box);beep();
 try{if(document.hidden&&window.Notification&&Notification.permission==='granted'){new Notification('DayPlan',{body:msg});}}catch(e){}}
function markDone(id,d){var i,t;for(i=0;i<S.tasks.length;i++){t=S.tasks[i];if(t.id===id){t.done=t.done||{};t.done[key(d)]=true;}}save();render();}

function tick(){
 var now=new Date(),ds=key(now),m=now.getHours()*60+now.getMinutes(),k,i,ts,t,f=S.fired,ch=false;
 for(k in f){if(f.hasOwnProperty(k)&&k.split('|')[1]!==ds){delete f[k];ch=true;}}
 var mm=mins(S.morning);
 if(m>=mm&&!f['m|'+ds]){f['m|'+ds]=1;ch=true;if(m<mm+180)alertUser('Good morning! Time to plan your day.',null,true);}
 ts=forDay(now);
 for(i=0;i<ts.length;i++){t=ts[i];if(!t.time||isDone(t,now))continue;
  var tm=mins(t.time),kk=t.id+'|'+ds;
  if(!f[kk]&&m>=tm-t.lead){f[kk]=1;ch=true;if(m<=tm+60)alertUser((t.lead>0&&m<tm?'In '+(tm-m)+' min: ':'Now: ')+t.title,t.id);}}
 for(i=snz.length-1;i>=0;i--){if(Date.now()>=snz[i].at){alertUser('Snoozed: '+snz[i].msg.replace(/^Snoozed: /,''),snz[i].id);snz.splice(i,1);}}
 if(ch)save();
 if(!document.querySelector('.ov.show'))render();
}

document.addEventListener('click',function(e){var t=e.target,v;unlock();
 if(t.getAttribute){
  if((v=t.getAttribute('data-d'))){var a=v.split('-');sel=new Date(+a[0],+a[1]-1,+a[2]);render();}
  else if((v=t.getAttribute('data-k'))){var i,x;for(i=0;i<S.tasks.length;i++){x=S.tasks[i];if(x.id===v){x.done=x.done||{};var dk=key(sel);if(x.done[dk])delete x.done[dk];else x.done[dk]=true;}}save();render();}
  else if((v=t.getAttribute('data-x'))){if(confirm('Delete this task?')){S.tasks=S.tasks.filter(function(q){return q.id!==v;});save();render();}}
  else if((v=t.getAttribute('data-i'))){openAdd(IDEAS[+v]);}
  else if((v=t.getAttribute('data-c'))){setCat(v);}
 }});
$('fab').onclick=function(){openAdd('');};
$('f-save').onclick=addTask;
$('f-cancel').onclick=function(){openSheet('sheet',false);};
$('gear').onclick=function(){$('s-morn').value=S.morning;
 $('s-note').textContent='Reminders ring, beep and pop up while DayPlan is open on your screen. iPhones cannot run web apps in the background, so keep DayPlan open (or use Add to Home Screen) and set the screen to stay on. Your tasks are saved on this phone. '+(navigator.serviceWorker&&navigator.serviceWorker.controller?'Offline mode is on.':'Offline mode switches on after you open the app once with internet and then reopen it.');
 $('s-notif').style.display=window.Notification?'block':'none';openSheet('set',true);};
$('s-close').onclick=function(){S.morning=$('s-morn').value||'07:00';var d=key(new Date());delete S.fired['m|'+d];save();openSheet('set',false);render();};
$('s-notif').onclick=function(){try{Notification.requestPermission(function(p){$('s-notif').textContent=p==='granted'?'Notifications allowed':'Notifications blocked';});}catch(e){}};
$('s-test').onclick=function(){unlock();openSheet('set',false);alertUser('Test: this is how your reminders look.',null);};

var EX=[
 {n:'Free day',l:[['Full rest. An easy walk is fine if you feel like it.','','']]},
 {n:'Upper body push + core',l:[['Push-ups (incline if needed)','3 × 10–12','3–4 × 12–15'],['Pike push-ups','3 × 8–10','3–4 × 10–12'],['Triceps dips off a chair','3 × 10–12','3–4 × 12–15'],['Plank','3 × 20–30 sec','3–4 × 30–45 sec'],['Dead bug','3 × 10 per side','3–4 × 12 per side']]},
 {n:'Cardio',l:[['Brisk walk or jog (2 min fast, 2 min easy)','25–30 min','30–35 min']]},
 {n:'Lower body (no squats) + core',l:[['Glute bridges','3 × 12','3–4 × 15'],['Step-ups on a stair','3 × 10 per leg','3–4 × 12 per leg'],['Calf raises','3 × 12','3–4 × 15'],['Hip hinges (hips back, flat back)','3 × 10','3–4 × 12'],['Reverse crunches','3 × 10','3–4 × 12']]},
 {n:'Upper body pull + cardio',l:[['Backpack or towel rows','3 × 10–12','3–4 × 12–15'],['Superman holds','3 × 20–30 sec','3–4 × 30–45 sec'],['Reverse snow angels','3 × 10','3–4 × 12'],['Jumping jacks or skipping','3 × 3 min, 1 min rest','10 min nonstop']]},
 {n:'Full-body circuit',h:['3 rounds, rest 1 min between rounds','4 rounds, rest 1 min between rounds'],l:[['Push-ups','10','12'],['Glute bridges','12','15'],['Plank','20 sec','30 sec'],['Mountain climbers','20 sec','30 sec'],['Step-ups','10 per leg','12 per leg']]},
 {n:'Light day',l:[['Walk','30–40 min','30–40 min'],['Easy stretching or mobility','10 min','10 min']]}];
function exLine(d){var dec=new Date().getMonth()===11,e=EX[d],i,r=[];if(e.h)r.push(e.h[dec?1:0]);
 for(i=0;i<e.l.length;i++)r.push(e.l[i][0]+(e.l[i][1]?' – '+(dec?e.l[i][2]:e.l[i][1]):''));return r.join('; ');}
var MENU=[
 ['3-egg veg omelette, 1 slice whole-grain bread, fruit','Chicken or beans, brown rice, kachumbari','Yoghurt and banana','Fish or lentils, sautéed greens, small ugali'],
 ['Oats in milk with peanut butter and fruit','Githeri with avocado and salad','2 boiled eggs','Grilled chicken, sweet potato, cabbage'],
 ['2 eggs, tomato, 1 slice bread, fruit','Beef or bean stew, small rice, greens','Handful of nuts and an apple','Fish, vegetables, small chapati'],
 ['Porridge with milk, a boiled egg','Chicken, potatoes, mixed veg salad','Yoghurt and fruit','Lentils (dengu), greens, small ugali'],
 ['Oats with banana and peanut butter','Tuna or beans, whole-grain pasta, veg','Boiled egg and carrot sticks','Grilled meat or fish, rice, cabbage'],
 ['Veg omelette, bread, fruit','Chicken stew, rice, salad','Nuts and fruit','Beans or fish, greens, small ugali'],
 ['Breakfast you enjoy','Family meal, normal portion','Your choice','Your choice. Stop when comfortably full.']];
var RULES=['3 meals and 1–2 snacks every day. Do not skip meals.','Each plate: about ½ vegetables or fruit, ¼ protein, ¼ carbs.','Aim for about 100–120 g protein a day (eggs, beans, lentils, chicken, fish, milk, yoghurt).','Drink 2.5–3 litres of water. Swap soda and packaged juice for water.','Eat carbs + protein 1–2 hours before training and a proper meal after.','Treats once or twice a week are fine. Sunday is a free day, not a binge day.'];
var MT=['Breakfast','Lunch','Snack','Dinner'],tab='ex';
var n0=0;
function planDefs(){var a=[],d;for(d=1;d<=6;d++)a.push({pk:'w'+d,title:'Workout: '+EX[d].n,cat:'exercise',time:'16:00',lead:10,repeat:'dow',dow:[d],wd:d});
 a.push({pk:'b',title:'Breakfast',time:'07:30'},{pk:'l',title:'Lunch',time:'13:00'},{pk:'s',title:'Snack',time:'16:00'},{pk:'d',title:'Dinner',time:'19:30'});return a;}
function seedPlan(){var defs=planDefs(),i,j,ds=key(new Date()),have,df,added=0;
 for(i=0;i<defs.length;i++){df=defs[i];have=false;for(j=0;j<S.tasks.length;j++){if(S.tasks[j].pk===df.pk)have=true;}
  if(!have){S.tasks.push({id:'p'+Date.now()+(n0++),pk:df.pk,src:'plan',title:df.title,cat:df.cat||'other',time:df.time,lead:df.lead||0,repeat:df.repeat||'daily',dow:df.dow,wd:df.wd,date:ds,done:{}});added++;}}
 return added;}
function missingPlan(){var defs=planDefs(),m=0,i,j,h;for(i=0;i<defs.length;i++){h=false;for(j=0;j<S.tasks.length;j++){if(S.tasks[j].pk===defs[i].pk)h=true;}if(!h)m++;}return m;}
function renderPlans(){
 var dow=new Date().getDay(),mi=(dow+6)%7,o='',i,j,mon=new Date().getMonth();
 $('tb-ex').className=tab==='ex'?'on':'';$('tb-di').className=tab==='di'?'on':'';
 if(tab==='ex'){
  var dec=mon===11;
  o+='<div class="pb"><h3>'+(dec?'December':'November')+' targets</h3><p>'+(dec?'3–4 sets of 12–15 reps, holds 30–45 sec, cardio 30–35 min. Make it harder by going slower or adding a loaded backpack.':'3 sets of 10–12 reps, holds 20–30 sec, cardio 25–30 min. Stop with about 2 reps left in the tank.')+'</p><p class="sm">Warm up 5 min (march, arm circles, hip circles). Cool down 5 min of gentle stretching. No squats anywhere in this plan.</p></div>';
  var order=[1,2,3,4,5,6,0];
  for(i=0;i<7;i++){var d=order[i],e=EX[d];o+='<div class="pb'+(d===dow?' now':'')+'"><h3>'+DN[d]+(d===dow?' (today)':'')+': '+e.n+'</h3><ul>';if(e.h)o+='<li><b>'+e.h[dec?1:0]+'</b></li>';for(j=0;j<e.l.length;j++)o+='<li>'+esc(e.l[j][0])+(e.l[j][1]?' – <b>'+(dec?e.l[j][2]:e.l[j][1])+'</b>':'')+'</li>';o+='</ul></div>';}
 } else {
  o+='<div class="pb"><h3>Simple rules</h3><ul>';for(i=0;i<RULES.length;i++)o+='<li>'+RULES[i]+'</li>';o+='</ul><p class="sm">Swap in local foods you like, keeping portions similar.</p></div>';
  var ord=[0,1,2,3,4,5,6];
  for(i=0;i<7;i++){var di=(i+1)%7;o+='<div class="pb'+(di===dow?' now':'')+'"><h3>'+DN[di]+(di===dow?' (today)':'')+'</h3>';for(j=0;j<4;j++)o+='<p><b>'+MT[j]+':</b> '+esc(MENU[i][j])+'</p>';o+='</div>';}
 }
 $('pl-body').innerHTML=o;$('pl-add').style.display=missingPlan()?'block':'none';$('pl-add').textContent='Restore deleted plan reminders';
}
function togglePlan(){seedPlan();save();renderPlans();render();}
$('plb').onclick=function(){renderPlans();openSheet('plans',true);};
$('pl-close').onclick=function(){openSheet('plans',false);};
$('pl-add').onclick=togglePlan;
$('tb-ex').onclick=function(){tab='ex';renderPlans();};
$('tb-di').onclick=function(){tab='di';renderPlans();};

function dAgo(i){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate()-i);}
function dayStat(d){var ts=forDay(d),n=ts.length,k=0,i;for(i=0;i<n;i++){if(isDone(ts[i],d))k++;}return {n:n,k:k,p:n?k/n:0};}
function renderProg(){
 var i,j,st,d,ts,tn=0,tk=0,w=0,wk=0,cats={exercise:0,study:0,chores:0,other:0},good=[],run=0,best=0,streak=0,bars='';
 for(i=0;i<30;i++){d=dAgo(i);st=dayStat(d);tn+=st.n;tk+=st.k;if(i<7){w+=st.n;wk+=st.k;}
  ts=forDay(d);for(j=0;j<ts.length;j++){if(isDone(ts[j],d))cats[ts[j].cat]++;}}
 for(i=0;i<90;i++){st=dayStat(dAgo(i));good[i]=st.n>0&&st.p>=0.7;}
 for(i=89;i>=0;i--){if(good[i]){run++;if(run>best)best=run;}else run=0;}
 i=good[0]?0:1;while(i<90&&good[i]){streak++;i++;}
 for(i=13;i>=0;i--){d=dAgo(i);st=dayStat(d);bars+='<div class="gc"><div class="gb" style="height:'+Math.round(st.p*90)+'px;'+(st.n?'':'opacity:.25')+'"></div>'+DN[d.getDay()].charAt(0)+'</div>';}
 var pc=function(a,b){return b?Math.round(a/b*100)+'%':'–';};
 $('pg-body').innerHTML='<div class="sg"><div><div class="pb"><div class="big">'+pc(wk,w)+'</div><div class="sm">done this week ('+wk+' of '+w+')</div></div></div><div><div class="pb"><div class="big">'+pc(tk,tn)+'</div><div class="sm">done in 30 days ('+tk+' of '+tn+')</div></div></div><div><div class="pb"><div class="big">'+streak+'</div><div class="sm">day streak</div></div></div><div><div class="pb"><div class="big">'+best+'</div><div class="sm">best streak</div></div></div></div>'
 +'<div class="pb" style="margin-top:10px"><h3>Last 14 days</h3><div class="gr">'+bars+'</div><p class="sm">Bar height is the share of that day’s tasks you finished. A day counts toward your streak when you finish at least 70%.</p></div>'
 +'<div class="pb"><h3>Finished in the last 30 days</h3><p>Exercise: <b>'+cats.exercise+'</b> · Study: <b>'+cats.study+'</b> · Chores: <b>'+cats.chores+'</b> · Other: <b>'+cats.other+'</b></p></div>';
}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function dec(c){return JSON.parse(decodeURIComponent(escape(atob(c.replace(/\s+/g,'')))));}
$('prb').onclick=function(){renderProg();openSheet('prog',true);};
$('pg-close').onclick=function(){openSheet('prog',false);};
$('s-bk').onclick=function(){var ta=$('s-code'),ok=false;ta.value='DP1:'+enc(S);ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length);}catch(e){}
 try{ok=document.execCommand('copy');}catch(e){}
 alert(ok?'Backup code copied. Paste it into Notes.':'Press and hold the code, tap Select All, then Copy. Paste it into Notes.');};
$('s-rs').onclick=function(){var c=$('s-code').value.replace(/^\s+|\s+$/g,''),o;
 if(c.indexOf('DP1:')!==0){alert('Paste a backup code that starts with DP1: first.');return;}
 try{o=dec(c.slice(4));}catch(e){o=null;}
 if(!o||!o.tasks||typeof o.morning!=='string'){alert('That backup code is not valid. Check that you copied all of it.');return;}
 if(!confirm('Replace everything in the app with this backup?'))return;
 S=o;if(!S.fired)S.fired={};S.seeded=1;save();$('s-code').value='';openSheet('set',false);render();alert('Backup restored.');};
try{if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}}catch(e){}
load();if(!S.seeded){seedPlan();S.seeded=1;save();}render();tick();setInterval(tick,15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
})();
</script>
